<title>Particle Creature</title>
<style>
  :root{
    --bg:#090909;
    --panel:#0e0e11;
    --border:#222226;
    --text:#eae8f0;
    --muted:#8b8a94;
    --accent:#cfc9ff;
    --track:#232329;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:row;
    font-family:"JetBrains Mono","SF Mono",Menlo,monospace;
    color:var(--text);
  }

  main{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    min-width:0;
    min-height:0;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  }
  .stage{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{
    display:block;
  }

  aside{
    flex:0 0 auto;
    width:264px;
    max-width:38vw;
    height:100%;
    background:var(--panel);
    border-left:1px solid var(--border);
    padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)) 18px;
    padding-right:calc(18px + env(safe-area-inset-right,0px));
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:10.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .field .row span.val{
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:16px;
    background:transparent;
    margin:0;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:2px;
    background:var(--track);
    border-radius:2px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:11px;
    height:11px;
    margin-top:-4.5px;
    border-radius:50%;
    background:var(--accent);
    border:none;
    cursor:pointer;
  }
  input[type="range"]::-moz-range-track{
    height:2px;
    background:var(--track);
    border-radius:2px;
  }
  input[type="range"]::-moz-range-thumb{
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--accent);
    border:none;
    cursor:pointer;
  }

  button#resetBtn{
    margin-top:4px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    font-family:inherit;
    font-size:10.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:9px 10px;
    border-radius:4px;
    cursor:pointer;
  }
  button#resetBtn:hover{
    color:var(--text);
    border-color:var(--accent);
  }

  @media (max-width:700px){
    body{flex-direction:column;}
    aside{
      width:100%;
      max-width:none;
      height:auto;
      border-left:none;
      border-top:1px solid var(--border);
      flex-direction:row;
      flex-wrap:wrap;
      max-height:42vh;
    }
    .field{width:calc(50% - 8px);}
    main{height:58vh;}
  }
</style>

<main>
  <div class="stage"><canvas id="gl"></canvas></div>
</main>

<aside id="panel"></aside>

<script>
(() => {
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
  if (!gl) {
    document.querySelector('.stage').textContent = 'WebGL2 に対応していないブラウザです。';
    return;
  }

  const SPACE = 400; // original createCanvas(400,400) coordinate space

  const vertSrc = `#version 300 es
  precision highp float;
  uniform float uT;
  uniform vec2 uResolution;
  uniform float uPointSize;
  uniform float uGroups;
  uniform float uSpacing;
  uniform float uSpike;
  uniform float uAmp;
  uniform float uYFreq;
  uniform float uTwist;

  void main() {
    float i = float(gl_VertexID);
    float m = mod(i, uGroups) * uSpacing;

    float k = uSpike * cos(i * 5.0) * sin(i);
    float e = cos(i * 3.0) * cos(i * 2.0) * uSpike;
    float mg = sqrt(k * k + e * e);

    float d = pow(mg, 3.0) / 1999.0 + 1.5 - pow(sin(uT / 2.0 + m), 3.0) / 3.0;
    float c = d / 16.0 - uT / uTwist + m;
    float p = pow(d, sin(d * d - uT + m));

    float x = uAmp * sin(c) + k * p + 200.0;
    float y = uAmp * sin(c * uYFreq) + e * p + 200.0;

    vec2 clip = (vec2(x, y) / uResolution) * 2.0 - 1.0;
    clip.y = -clip.y;

    gl_Position = vec4(clip, 0.0, 1.0);
    gl_PointSize = uPointSize;
  }`;

  const fragSrc = `#version 300 es
  precision highp float;
  uniform float uOpacity;
  out vec4 fragColor;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    if (d > 0.5) discard;
    float a = smoothstep(0.5, 0.15, d) * uOpacity;
    fragColor = vec4(1.0, 1.0, 1.0, a);
  }`;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  const uT = gl.getUniformLocation(prog, 'uT');
  const uResolution = gl.getUniformLocation(prog, 'uResolution');
  const uPointSize = gl.getUniformLocation(prog, 'uPointSize');
  const uGroups = gl.getUniformLocation(prog, 'uGroups');
  const uSpacing = gl.getUniformLocation(prog, 'uSpacing');
  const uSpike = gl.getUniformLocation(prog, 'uSpike');
  const uAmp = gl.getUniformLocation(prog, 'uAmp');
  const uYFreq = gl.getUniformLocation(prog, 'uYFreq');
  const uTwist = gl.getUniformLocation(prog, 'uTwist');
  const uOpacity = gl.getUniformLocation(prog, 'uOpacity');

  gl.uniform2f(uResolution, SPACE, SPACE);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  // a bare VAO is required in WebGL2 to issue a vertex-id-only draw
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  const bgVal = 9 / 255;

  // ---- adjustable parameters ------------------------------------------
  const DEFAULTS = {
    particles: 10000,
    speed:     1,
    pointSize: 1.6,
    opacity:   0.376,
    groups:    16,
    spacing:   13,
    spike:     9,
    amp:       99,
    yFreq:     4,
    twist:     48,
  };
  const FIELDS = [
    { key: 'particles', label: 'パーティクル数', min: 500,  max: 20000, step: 100,  digits: 0 },
    { key: 'speed',     label: '速度',           min: 0,    max: 3,     step: 0.05, digits: 2 },
    { key: 'pointSize', label: '粒サイズ',        min: 0.5,  max: 4,     step: 0.1,  digits: 1 },
    { key: 'opacity',   label: '不透明度',        min: 0.02, max: 1,     step: 0.01, digits: 2 },
    { key: 'groups',    label: 'グループ数',      min: 2,    max: 64,    step: 1,    digits: 0 },
    { key: 'spacing',   label: '間隔',            min: 1,    max: 40,    step: 0.5,  digits: 1 },
    { key: 'spike',     label: '尖り',            min: 0,    max: 20,    step: 0.1,  digits: 1 },
    { key: 'amp',       label: '半径',            min: 20,   max: 160,   step: 1,    digits: 0 },
    { key: 'yFreq',     label: 'Y周波数',         min: 0.5,  max: 8,     step: 0.1,  digits: 1 },
    { key: 'twist',     label: '捻れ',            min: 8,    max: 160,   step: 1,    digits: 0 },
  ];

  const params = { ...DEFAULTS };
  const panel = document.getElementById('panel');
  const valEls = {};

  FIELDS.forEach(f => {
    const field = document.createElement('div');
    field.className = 'field';

    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('span');
    label.textContent = f.label;
    const val = document.createElement('span');
    val.className = 'val';
    val.textContent = params[f.key].toFixed(f.digits);
    row.append(label, val);
    valEls[f.key] = val;

    const input = document.createElement('input');
    input.type = 'range';
    input.min = f.min;
    input.max = f.max;
    input.step = f.step;
    input.value = params[f.key];
    input.id = 'field-' + f.key;
    input.addEventListener('input', () => {
      params[f.key] = parseFloat(input.value);
      valEls[f.key].textContent = params[f.key].toFixed(f.digits);
    });

    field.append(row, input);
    panel.appendChild(field);
    f.input = input;
  });

  const resetBtn = document.createElement('button');
  resetBtn.id = 'resetBtn';
  resetBtn.type = 'button';
  resetBtn.textContent = 'リセット';
  resetBtn.addEventListener('click', () => {
    FIELDS.forEach(f => {
      params[f.key] = DEFAULTS[f.key];
      f.input.value = DEFAULTS[f.key];
      valEls[f.key].textContent = DEFAULTS[f.key].toFixed(f.digits);
    });
  });
  panel.appendChild(resetBtn);

  // ---- render loop -------------------------------------------------------
  function resize() {
    const stage = document.querySelector('.stage');
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const side = Math.max(1, Math.floor(Math.min(rect.width, rect.height)));
    const px = Math.round(side * dpr);
    canvas.style.width = side + 'px';
    canvas.style.height = side + 'px';
    if (canvas.width !== px || canvas.height !== px) {
      canvas.width = px;
      canvas.height = px;
      gl.viewport(0, 0, px, px);
    }
    canvas.dataset.dpr = dpr;
  }

  let t = 0;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame() {
    resize();
    const dpr = parseFloat(canvas.dataset.dpr) || 1;
    if (!reduceMotion) t += (Math.PI / 20) * params.speed;

    gl.clearColor(bgVal, bgVal, bgVal, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform1f(uT, t);
    gl.uniform1f(uPointSize, Math.max(1, params.pointSize * dpr));
    gl.uniform1f(uGroups, Math.max(1, params.groups));
    gl.uniform1f(uSpacing, params.spacing);
    gl.uniform1f(uSpike, params.spike);
    gl.uniform1f(uAmp, params.amp);
    gl.uniform1f(uYFreq, params.yFreq);
    gl.uniform1f(uTwist, params.twist === 0 ? 0.0001 : params.twist);
    gl.uniform1f(uOpacity, params.opacity);

    gl.drawArrays(gl.POINTS, 0, Math.round(params.particles));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('resize', resize);
})();
</script>
